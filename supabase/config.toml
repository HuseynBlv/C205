# Supabase CLI project config. Committed to version control by convention.
# If `supabase start` complains this is out of date for your installed CLI
# version, run `npx supabase init --force` to regenerate it, then re-apply
# any local edits (project_id, [db.seed].sql_paths) — do not hand-edit
# fields you don't recognize.

project_id = "c205"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = true
enable_confirmations = false

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false
