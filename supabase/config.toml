# Supabase CLI project config. Committed to version control by convention.
# If `supabase start` complains this is out of date for your installed CLI
# version, run `npx supabase init --force` to regenerate it, then re-apply
# any local edits (project_id, [db.seed].sql_paths) — do not hand-edit
# fields you don't recognize.

project_id = "c205"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/**"]
jwt_expiry = 3600
enable_signup = true
enable_confirmations = true

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = true

# The CLI's built-in default templates use GoTrue's own hosted
# /auth/v1/verify endpoint (the older implicit-flow link, tokens delivered
# in a URL fragment). Our /auth/confirm route handler expects the current
# token_hash pattern instead (verifyOtp, server-side, no fragment) — these
# overrides are required for that route to ever actually receive a
# token_hash. A hosted project needs the equivalent templates set in the
# dashboard (Authentication → Email Templates) — see README.md.
[auth.email.template.confirmation]
subject = "Confirm your email address"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your password"
content_path = "./supabase/templates/recovery.html"

# Overrides for the hosted C205-prod project (huxclffxxtbhawiajsxm) when
# running `supabase config push` — everything else (email templates,
# enable_confirmations, etc.) is inherited from [auth] above unchanged.
# `supabase start` (local dev) never reads this block; only `config push`
# does, and only for the project whose ref matches `project_id` below.
#
# PLACEHOLDER: replace site_url and additional_redirect_urls with the real
# production domain once it's known, then re-run `supabase config push`.
#
# IMPORTANT: as of 2026-09-06, `config push` to this project rejects the
# WHOLE auth update (not just the template part) with "Email template
# modification is not available for free tier projects using the default
# email provider" whenever [auth.email.template.*] is included — until a
# custom SMTP provider is configured (Project Settings → Auth → SMTP
# Settings) or the project is upgraded off the free tier, pushing site_url
# changes requires temporarily commenting out the two
# [auth.email.template.*] blocks above, pushing, then restoring them
# (do NOT leave them commented — that breaks local dev's own /auth/confirm
# flow). Once SMTP is configured, `config push` should carry the templates
# through in one step with no special handling.
[remotes.production]
project_id = "huxclffxxtbhawiajsxm"

[remotes.production.auth]
site_url = "https://c205-prod.example.com"
additional_redirect_urls = ["https://c205-prod.example.com/**"]
