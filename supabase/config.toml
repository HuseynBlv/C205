# Supabase CLI project config. Committed to version control by convention.
# If `supabase start` complains this is out of date for your installed CLI
# version, run `npx supabase init --force` to regenerate it, then re-apply
# any local edits (project_id, [db.seed].sql_paths) — do not hand-edit
# fields you don't recognize.

project_id = "c205"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/**"]
jwt_expiry = 3600
enable_signup = true
enable_confirmations = true

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = true

# The CLI's built-in default templates use GoTrue's own hosted
# /auth/v1/verify endpoint (the older implicit-flow link, tokens delivered
# in a URL fragment). Our /auth/confirm route handler expects the current
# token_hash pattern instead (verifyOtp, server-side, no fragment) — these
# overrides are required for that route to ever actually receive a
# token_hash. A hosted project needs the equivalent templates set in the
# dashboard (Authentication → Email Templates) — see README.md.
[auth.email.template.confirmation]
subject = "Confirm your email address"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your password"
content_path = "./supabase/templates/recovery.html"

# Overrides for the hosted C205-prod project (huxclffxxtbhawiajsxm) when
# running `supabase config push` — everything else (email templates,
# enable_confirmations, etc.) is inherited from [auth] above unchanged.
# `supabase start` (local dev) never reads this block; only `config push`
# does, and only for the project whose ref matches `project_id` below.
[remotes.production]
project_id = "huxclffxxtbhawiajsxm"

[remotes.production.auth]
site_url = "https://c205.usg.az"
additional_redirect_urls = ["https://c205.usg.az/**", "https://c205.vercel.app/**"]

# Resolves the free-tier "Email template modification is not available ...
# using the default email provider" rejection that previously blocked any
# config push touching [auth.email.template.*] (see git history for the
# old temporarily-comment-out-the-templates workaround this replaces) —
# once a custom SMTP provider is set, that restriction lifts entirely and
# templates push through normally, same as everything else here.
#
# smtp.resend.com / user "resend" / the API key as the password is
# Resend's standard SMTP relay convention, not project-specific. `pass`
# reads from EMAIL_PROVIDER_API_KEY — the same Resend key already used by
# src/lib/email/resend.ts — via the CLI's own env(...) indirection, so the
# literal key is never committed here. Must be a real exported shell env
# var (not just present in .env.local, which only Next.js itself reads)
# whenever `config push` runs. admin_email must be on the now-verified
# mail.c205.usg.az domain.
[remotes.production.auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(EMAIL_PROVIDER_API_KEY)"
admin_email = "noreply@mail.c205.usg.az"
sender_name = "C205"
